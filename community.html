<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<title>Braggers Community — Donut Tycoon</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		:root {
			--text-dim: #9aa0a6;
		}
		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			background: #1a1a2e;
			color: #ffe;
			min-height: 100vh;
			min-height: 100dvh;
			-webkit-font-smoothing: antialiased;
		}
		.back-bar {
			position: sticky;
			top: 0;
			z-index: 10;
			background: rgba(26, 26, 46, 0.95);
			backdrop-filter: blur(10px);
			-webkit-backdrop-filter: blur(10px);
			border-bottom: 1px solid rgba(255, 255, 255, 0.1);
			padding: 12px 20px;
			display: flex;
			justify-content: space-between;
			align-items: center;
		}
		.back-link {
			color: #ffeb3b;
			text-decoration: none;
			font-size: 0.9rem;
			font-weight: 500;
			display: inline-flex;
			align-items: center;
			gap: 6px;
			transition: color 0.15s;
		}
		.back-link:hover { color: #fff; }
		.brag-link {
			color: #ff9100;
			text-decoration: none;
			font-size: 0.85rem;
			font-weight: 500;
			transition: color 0.15s;
		}
		.brag-link:hover { color: #fff; }
		.container {
			max-width: 680px;
			margin: 0 auto;
			padding: 24px 16px 60px;
		}
		h1 {
			font-size: 2rem;
			margin-bottom: 4px;
			color: #ffeb3b;
			text-align: center;
		}
		.subtitle {
			font-size: 0.9rem;
			color: #a5d6a7;
			margin-bottom: 20px;
			text-align: center;
		}
		.stats-bar {
			text-align: center;
			margin-bottom: 20px;
			padding: 10px 0;
		}
		.stats-bar .counter {
			display: inline-block;
			background: rgba(255, 255, 255, 0.06);
			border: 1px solid rgba(255, 255, 255, 0.12);
			border-radius: 20px;
			padding: 8px 18px;
			font-size: 0.9rem;
			font-weight: 600;
			color: #ffeb3b;
			letter-spacing: 0.3px;
		}
		.stats-bar .counter span {
			color: #fff;
		}
		.loading {
			text-align: center;
			color: var(--text-dim);
			padding: 40px 0;
			font-size: 0.95rem;
		}
		.empty-state {
			text-align: center;
			padding: 60px 20px;
		}
		.empty-state .icon { font-size: 4rem; margin-bottom: 16px; }
		.empty-state p { color: var(--text-dim); font-size: 1rem; margin-bottom: 8px; }
		.empty-state .cta { color: #ff9100; font-weight: 600; text-decoration: none; font-size: 1rem; }
		.bragger-card {
			background: rgba(255, 255, 255, 0.05);
			border: 1px solid rgba(255, 255, 255, 0.1);
			border-radius: 14px;
			overflow: hidden;
			margin-bottom: 20px;
			transition: transform 0.15s, box-shadow 0.15s;
		}
		.bragger-card:hover {
			transform: translateY(-2px);
			box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
		}
		.bragger-card img {
			width: 100%;
			height: auto;
			display: block;
			border-bottom: 1px solid rgba(255, 255, 255, 0.08);
		}
		.bragger-card .info {
			padding: 14px 18px;
			display: flex;
			flex-wrap: wrap;
			gap: 12px;
			align-items: center;
			font-size: 0.9rem;
			color: #d0d3d8;
		}
		.bragger-card .info .name {
			font-weight: 600;
			color: #fff;
			font-size: 1rem;
		}
		.bragger-card .info .rank {
			color: #ffd700;
			font-weight: 600;
		}
		.bragger-card .info .cps {
			color: #a5d6a7;
		}
		.bragger-card .info .time {
			margin-left: auto;
			font-size: 0.8rem;
			color: var(--text-dim);
		}
		.error-state {
			text-align: center;
			padding: 40px 20px;
			color: #f28b82;
		}
		.error-state button {
			margin-top: 12px;
			padding: 10px 20px;
			background: rgba(255,255,255,0.1);
			border: 1px solid rgba(255,255,255,0.2);
			color: #fff;
			border-radius: 8px;
			cursor: pointer;
			font-family: inherit;
			font-size: 0.9rem;
		}
	</style>
</head>
<body>

	<div class="back-bar">
		<a href="brag.html" class="back-link">← Back to Bragger</a>
		<a href="brag.html" class="brag-link">📜 Create Yours</a>
	</div>

	<div class="container">
		<h1>🍩 Braggers Community</h1>
		<p class="subtitle">See how others are flexing their empires</p>

		<div class="stats-bar" id="statsBar" style="display:none;">
			<div class="counter">🍩 <span id="braggerCount">0</span> braggers shared</div>
		</div>

		<div class="loading" id="loading">Loading braggers...</div>
		<div class="empty-state" id="emptyState" style="display:none;">
			<div class="icon">🍩</div>
			<p>No braggers shared yet.</p>
			<p>Be the first to flex your empire!</p>
			<a href="brag.html" class="cta">Create your bragger →</a>
		</div>
		<div class="error-state" id="errorState" style="display:none;">
			<p>Couldn't load braggers.</p>
			<button onclick="location.reload()">Try Again</button>
		</div>
		<div id="braggersFeed"></div>
	</div>

	<script>
		document.addEventListener('DOMContentLoaded', function() {

			var JSONBIN_URL = 'https://api.npoint.io/8f3a1b2c4d5e6f7a8b9c';
			var loading = document.getElementById('loading');
			var emptyState = document.getElementById('emptyState');
			var errorState = document.getElementById('errorState');
			var statsBar = document.getElementById('statsBar');
			var braggerCount = document.getElementById('braggerCount');
			var feed = document.getElementById('braggersFeed');

			function getRelativeTime(timestamp) {
				var now = Date.now();
				var diff = now - timestamp;
				var seconds = Math.floor(diff / 1000);
				var minutes = Math.floor(seconds / 60);
				var hours = Math.floor(minutes / 60);
				var days = Math.floor(hours / 24);
				if (days > 30) return Math.floor(days / 30) + " month" + (Math.floor(days / 30) > 1 ? "s" : "") + " ago";
				if (days > 0) return days + " day" + (days > 1 ? "s" : "") + " ago";
				if (hours > 0) return hours + " hour" + (hours > 1 ? "s" : "") + " ago";
				if (minutes > 0) return minutes + " minute" + (minutes > 1 ? "s" : "") + " ago";
				return "just now";
			}

			function getCountryFlag(countryCode) {
				if (!countryCode || countryCode === 'Earth') return '🌍';
				var codePoints = [];
				for (var i = 0; i < 2; i++) {
					codePoints.push(0x1F1E6 + countryCode.charCodeAt(i) - 65);
				}
				return String.fromCodePoint(codePoints[0], codePoints[1]);
			}

			function getStarString(stars) {
				var s = '';
				for (var i = 0; i < stars; i++) s += '★';
				return s;
			}

			function renderBraggers(braggers) {
				feed.innerHTML = '';

				var count = braggers.length;
				braggerCount.textContent = count;
				if (count > 0) {
					statsBar.style.display = 'block';
				} else {
					statsBar.style.display = 'none';
					emptyState.style.display = 'block';
					return;
				}
				emptyState.style.display = 'none';

				for (var i = 0; i < braggers.length; i++) {
					var b = braggers[i];
					if (!b || !b.imageUrl) continue;

					var card = document.createElement('div');
					card.className = 'bragger-card';

					var flag = getCountryFlag(b.countryCode || 'Earth');
					var timeStr = b.timestamp ? getRelativeTime(b.timestamp) : '';

					card.innerHTML =
						'<img src="' + b.imageUrl + '" alt="Bragger by ' + (b.name || 'Unknown') + '" loading="lazy" />' +
						'<div class="info">' +
							'<span class="name">' + (b.name || 'Anonymous') + '</span>' +
							'<span class="rank">' + getStarString(b.stars || 1) + ' ' + (b.rankTitle || 'Tycoon') + '</span>' +
							'<span class="cps">⚡ ' + ((b.cps || 0).toFixed(1)) + '/s</span>' +
							'<span>' + flag + ' ' + (b.countryName || 'Earth') + '</span>' +
							(timeStr ? '<span class="time">' + timeStr + '</span>' : '') +
						'</div>';

					feed.appendChild(card);
				}
			}

			function fetchBraggers() {
				loading.style.display = 'block';
				emptyState.style.display = 'none';
				errorState.style.display = 'none';
				statsBar.style.display = 'none';

				var xhr = new XMLHttpRequest();
				xhr.open('GET', JSONBIN_URL, true);
				xhr.timeout = 8000;
				xhr.onload = function() {
					loading.style.display = 'none';
					if (xhr.status === 200) {
						try {
							var data = JSON.parse(xhr.responseText);
							if (Array.isArray(data) && data.length > 0) {
								renderBraggers(data);
							} else {
								emptyState.style.display = 'block';
							}
						} catch (e) {
							emptyState.style.display = 'block';
						}
					} else {
						emptyState.style.display = 'block';
					}
				};
				xhr.onerror = function() {
					loading.style.display = 'none';
					errorState.style.display = 'block';
				};
				xhr.ontimeout = function() {
					loading.style.display = 'none';
					errorState.style.display = 'block';
				};
				xhr.send();
			}

			fetchBraggers();
		});
	</script>
</body>
</html>
